name: Delete legacy branch

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/delete-legacy-branch.yml

permissions:
  contents: write

jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Delete legacy branch
        run: git push origin --delete fix/keychain-session-cache
