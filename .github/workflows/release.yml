name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - VERSION
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example v0.3.2"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            tag="${{ inputs.version }}"
          elif [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            tag="$GITHUB_REF_NAME"
          else
            number="$(tr -d '[:space:]' < VERSION)"
            tag="v$number"
          fi
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "number=${tag#v}" >> "$GITHUB_OUTPUT"
      - name: Check signing secrets
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          [[ -n "$APPLE_CERTIFICATE_P12" ]]
          [[ -n "$APPLE_CERTIFICATE_PASSWORD" ]]
          [[ -n "$APPLE_ID" ]]
          [[ -n "$APPLE_TEAM_ID" ]]
          [[ -n "$APPLE_APP_SPECIFIC_PASSWORD" ]]
      - name: Import Developer ID certificate
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          certificate_path="$RUNNER_TEMP/developer-id.p12"
          keychain_path="$RUNNER_TEMP/claudehub-signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"

          printf '%s' "$APPLE_CERTIFICATE_P12" | base64 --decode > "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" -k "$keychain_path" \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$keychain_password" "$keychain_path"
          security list-keychains -d user -s "$keychain_path"

          identity="$(security find-identity -v -p codesigning "$keychain_path" |
            sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' | head -n 1)"
          [[ -n "$identity" ]]
          echo "CLAUDE_HUB_SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"
      - name: Test
        run: swift test
      - name: Build signed application
        env:
          CLAUDE_HUB_VERSION: ${{ steps.version.outputs.number }}
        run: bash scripts/build-app.sh
      - name: Package signed DMG
        run: bash scripts/package-dmg.sh dist/ClaudeHub.app dist/ClaudeHub-${{ steps.version.outputs.tag }}-macOS-arm64.dmg
      - name: Sign and notarize DMG
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          dmg="dist/ClaudeHub-${{ steps.version.outputs.tag }}-macOS-arm64.dmg"
          codesign --force --timestamp \
            --sign "$CLAUDE_HUB_SIGNING_IDENTITY" "$dmg"
          codesign --verify --verbose=2 "$dmg"
          xcrun notarytool submit "$dmg" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --wait
          xcrun stapler staple "$dmg"
          xcrun stapler validate "$dmg"
          spctl --assess --type open --context context:primary-signature -v "$dmg"
      - name: Checksums
        working-directory: dist
        run: shasum -a 256 *.dmg > SHA256SUMS.txt
      - name: Remove temporary keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/claudehub-signing.keychain-db" || true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            dist/*.dmg dist/SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title "ClaudeHub ${{ steps.version.outputs.tag }}" \
            --generate-notes
